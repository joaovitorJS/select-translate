<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Translate</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <nav class="abas">
      <button type="button" data-aba="traducao" class="ativa">Tradução</button>
      <button type="button" data-aba="historico">Histórico</button>
      <button type="button" data-aba="config">Configurações</button>
    </nav>

    <main>
      <section id="aba-traducao" class="painel">
        <h2>Texto original</h2>
        <p id="texto-original" class="texto-vazio">
          Selecione um texto em qualquer programa e pressione Ctrl+Alt+T.
        </p>

        <h2>Tradução</h2>
        <p id="texto-traduzido" class="texto-vazio">A tradução aparece aqui.</p>
      </section>

      <section id="aba-historico" class="painel oculto">
        <ul id="lista-historico"></ul>
      </section>

      <section id="aba-config" class="painel oculto">
        <p class="texto-vazio">A tela de configurações chega na Fase 5.</p>
      </section>
    </main>
  </body>
</html>
